# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DTO/'
            - '../src/StockAvailability/Contract/'

    stock_availability.soap_client:
        class: SoapClient
        factory: ['@App\StockAvailability\Client\StockAvailabilitySoapClientFactory', 'create']

    App\StockAvailability\Client\StockAvailabilityClient:
        arguments: ['@stock_availability.soap_client']
